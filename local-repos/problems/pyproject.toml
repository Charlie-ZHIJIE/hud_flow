[project]
name = "mac-rx-problem"
version = "0.1.0"
description = "MAC RX Stream Problem for HUD Evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cocotb>=2.0.0",
    "cocotb-test>=0.2.0",
    "pytest>=7.0.0",
    "pytest-timeout>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
timeout = 15
